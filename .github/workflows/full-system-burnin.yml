name: Full System Burn-In

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: full-system-burnin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desk-burnin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      QT_NONINTERACTIVE: "1"
      QT_NO_BROWSER: "1"
      KITE_ACCESS_TOKEN: ""
      KITE_API_KEY: ""
      KITE_API_SECRET: ""
      TELEGRAM_BOT_TOKEN: ""
      DEEPSEEK_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""

    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"

      - name: Install QuantTerm dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          cd frontend
          npm install
          npx playwright install --with-deps chromium

      - name: Start the canonical complete stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/product
          nohup python scripts/session_exec.py bash scripts/run_quantterm_complete.sh --restart             > logs/product/full_system_burnin_stack.log 2>&1 &
          echo $! > logs/product/full_system_burnin_stack.pid

      - name: Wait for real frontend, backend and safety readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for _ in $(seq 1 300); do
            api=0; ui=0; reports=0
            if curl -fsS --max-time 5 http://127.0.0.1:8765/api/health > logs/product/full_system_burnin_health.json 2>/dev/null; then api=1; fi
            if curl -fsS --max-time 5 http://127.0.0.1:5173/ >/dev/null 2>&1; then ui=1; fi
            if curl -fsS --max-time 5 http://127.0.0.1:8766/health >/dev/null 2>&1; then reports=1; fi
            if [[ "$api" = 1 && "$ui" = 1 && "$reports" = 1 ]]; then
              if python - <<'PY'
import json
from pathlib import Path
p=json.loads(Path('logs/product/full_system_burnin_health.json').read_text())
raise SystemExit(0 if (
    p.get('ok') is True
    and p.get('live_lock_verified') is True
    and p.get('live_locked') is True
    and p.get('live_execution_authorized') is False
) else 1)
PY
              then ready=1; break; fi
            fi
            if [[ -f logs/product/full_system_burnin_stack.pid ]] && ! kill -0 "$(cat logs/product/full_system_burnin_stack.pid)" 2>/dev/null; then
              echo "Complete stack exited during burn-in startup" >&2
              tail -250 logs/product/full_system_burnin_stack.log || true
              exit 1
            fi
            sleep 2
          done
          test "$ready" = 1

      - name: Ten accelerated operator-hours across every visible tab
        working-directory: frontend
        env:
          QT_BURNIN_ROUNDS: "10"
          QT_DESK_URL: "http://127.0.0.1:5173"
        run: npm run test:e2e

      - name: Prove learning and execution lanes remain safety-separated
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
import json
import urllib.request
from pathlib import Path

base='http://127.0.0.1:8765'
paths=[
    '/api/health',
    '/api/decision-simulation-gate',
    '/api/paper-autopilot',
    '/api/research-status',
    '/api/forward-evidence',
    '/api/product-contract',
]
out={}
for path in paths:
    with urllib.request.urlopen(base+path, timeout=30) as response:
        assert response.status == 200, (path, response.status)
        out[path]=json.load(response)

health=out['/api/health']
assert health.get('live_lock_verified') is True, health
assert health.get('live_locked') is True, health
assert health.get('live_execution_authorized') is False, health

gate=out['/api/decision-simulation-gate']
assert gate.get('simulation_scope') == ['PAPER_FORWARD', 'HISTORICAL_REPLAY'], gate
best=list(gate.get('best_trades') or [])
assert len(best) <= 5, len(best)
for row in best:
    status=str(row.get('production_candidate_status') or row.get('discovery_decision') or '')
    assert status in {'ENTER_NOW','RESERVE_CAPACITY'}, row
    if status == 'RESERVE_CAPACITY':
        assert row.get('production_execution_slot') is False, row
        assert row.get('production_reason_code') == 'NOT_TOP_OF_PORTFOLIO', row

contract=out['/api/product-contract']
assert contract.get('wired') is True, contract

Path('logs/product/full_system_burnin_surfaces.json').write_text(
    json.dumps(out, indent=2, default=str),
    encoding='utf-8',
)
PY

      - name: Prove stack remains alive after the burn-in
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quantterm_status.py > logs/product/full_system_burnin_status.json
          curl -fsS --max-time 10 http://127.0.0.1:8765/api/health > logs/product/full_system_burnin_health_final.json
          python - <<'PY'
import json
from pathlib import Path
h=json.loads(Path('logs/product/full_system_burnin_health_final.json').read_text())
s=json.loads(Path('logs/product/full_system_burnin_status.json').read_text())
assert h.get('ok') is True, h
assert h.get('live_lock_verified') is True, h
assert h.get('live_locked') is True, h
assert h.get('live_execution_authorized') is False, h
assert (s.get('market_api') or {}).get('healthy') is True, s
assert (s.get('desk') or {}).get('healthy') is True, s
PY

      - name: Upload burn-in evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-system-burnin-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            logs/product/full_system_burnin_*.json
            logs/product/full_system_burnin_stack.log
            frontend/test-results/
            frontend/playwright-report/
            logs/product/frontend_burnin.json

      - name: Stop the complete stack
        if: always()
        shell: bash
        run: |
          if [[ -f logs/product/full_system_burnin_stack.pid ]]; then
            pid="$(cat logs/product/full_system_burnin_stack.pid)"
            kill -INT "-$pid" 2>/dev/null || kill -INT "$pid" 2>/dev/null || true
          fi
