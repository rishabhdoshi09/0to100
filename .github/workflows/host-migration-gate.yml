name: Host Migration Gate

on:
  pull_request:
  push:
    branches: ["**"]

concurrency:
  group: host-migration-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-migration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Compile host migration path
        run: python -m py_compile product/host_install.py product/host_entrypoint.py core/runtime_paths.py

      - name: Run focused host migration regressions
        run: python -m pytest --noconftest tests/test_host_install.py -q
