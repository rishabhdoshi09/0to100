name: Terminal UI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "actual=$actual"
          echo "expected=$expected"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Compile terminal, product and research APIs
        run: |
          python -m py_compile terminal_api.py terminal_product_api.py report_api.py
          python -m py_compile reporting/evidence_intake.py reporting/research_dossier.py reporting/pdf_renderer.py
          python -m py_compile product/product_readiness.py product/stock_workspace.py product/workspace.py
