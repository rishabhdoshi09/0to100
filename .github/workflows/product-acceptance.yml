name: Product Acceptance

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: product-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      QT_NONINTERACTIVE: "1"
      QT_NO_BROWSER: "1"
      KITE_ACCESS_TOKEN: ""
      KITE_API_KEY: ""
      KITE_API_SECRET: ""
      TELEGRAM_BOT_TOKEN: ""
      DEEPSEEK_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""

    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "actual=$actual"
          echo "expected=$EXPECTED_SHA"
          test "$actual" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"

      - name: Install frontend and real-browser burn-in dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npx playwright install --with-deps chromium

      - name: Prepare evidence directory
        run: mkdir -p logs/product

      - name: Start complete QuantTerm virtual environment
        shell: bash
        run: |
          set -euo pipefail
          # Own a session so the restart gate can reproduce a terminal Ctrl-C
          # by signalling the launcher's foreground process group.
          nohup python scripts/session_exec.py bash scripts/run_quantterm_complete.sh --restart > logs/product/complete_stack.log 2>&1 &
          echo $! > logs/product/complete_stack.pid

      - name: Wait for automated bootstrap and complete desk readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for _ in $(seq 1 450); do
            api=0; ui=0; reports=0; health=0
            if curl -fsS --max-time 5 http://127.0.0.1:8765/api/health > logs/product/pre_acceptance_health.json 2>/dev/null; then api=1; fi
            if curl -fsS --max-time 5 http://127.0.0.1:5173/ >/dev/null 2>&1; then ui=1; fi
            if curl -fsS --max-time 5 http://127.0.0.1:8766/health > logs/product/pre_acceptance_report_health.json 2>/dev/null; then reports=1; fi
            if [[ "$api" = 1 ]]; then
              if venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("logs/product/pre_acceptance_health.json").read_text(encoding="utf-8"))
          components = {
              str(row.get("name") or ""): str(row.get("status") or "")
              for row in (p.get("components") or [])
              if isinstance(row, dict)
          }
          full_ready = (
              p.get("evidence_ready") is True
              and p.get("lifecycle") == "READY"
          )
          # A clean runner may need to acquire hundreds of genuine NSE sessions
          # before its first scan artifact exists. That is productive bootstrap,
          # not a readiness failure, provided every non-scan component is READY,
          # official history is already current, and the scan artifact is the only
          # remaining STARTING component. The later acceptance gate still requires
          # a real completed Market Scan, so this cannot manufacture evidence.
          scan_bootstrap = (
              p.get("evidence_ready") is False
              and p.get("lifecycle") == "DEGRADED"
              and bool((p.get("history") or {}).get("current"))
              and components.get("official_history") == "READY"
              and components.get("scan_artifact") == "STARTING"
              and all(
                  status == "READY"
                  for name, status in components.items()
                  if name != "scan_artifact"
              )
          )
          raise SystemExit(0 if (
              p.get("ok") is True
              and p.get("operational_ready") is True
              and (full_ready or scan_bootstrap)
              and p.get("live_lock_verified") is True
              and p.get("live_locked") is True
              and p.get("live_execution_authorized") is False
          ) else 1)
          PY
              then health=1; fi
            fi
            if [[ "$api" = 1 && "$ui" = 1 && "$reports" = 1 && "$health" = 1 ]]; then
              ready=1
              break
            fi
            if [[ -f logs/product/complete_stack.pid ]] && ! kill -0 "$(cat logs/product/complete_stack.pid)" 2>/dev/null; then
              echo "Complete stack exited before automated bootstrap reached READY" >&2
              tail -250 logs/product/complete_stack.log || true
              exit 1
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            echo "Automated bootstrap did not reach complete READY state" >&2
            cat logs/product/pre_acceptance_health.json || true
            tail -250 logs/product/complete_stack.log || true
            exit 1
          fi

      - name: Run ten accelerated operator-hours across every mounted frontend view
        id: browser_burnin
        continue-on-error: true
        working-directory: frontend
        env:
          QT_BURNIN_ROUNDS: "10"
          QT_DESK_URL: "http://127.0.0.1:5173"
        run: npm run test:e2e

      - name: Prove operator status probe works exactly as documented
        shell: bash
        run: |
          set -euo pipefail
          status_rc=0
          venv/bin/python scripts/quantterm_status.py > logs/product/operator_status.json || status_rc=$?
          cat logs/product/operator_status.json
          test "$status_rc" = 0
          venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('logs/product/operator_status.json').read_text(encoding='utf-8'))
          assert p.get('ready') is True, p
          assert (p.get('market_api') or {}).get('healthy') is True, p
          assert (p.get('desk') or {}).get('healthy') is True, p
          assert (p.get('market_ops') or {}).get('healthy') is True, p
          PY

      - name: Prove canonical live interlock is verified locked
        shell: bash
        run: |
          set -euo pipefail
          venv/bin/python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from product.live_execution_interlock import get_live_execution_state
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          state = get_live_execution_state()
          evidence = {
              "code_sha": sha,
              "verified": bool(state.verified),
              "locked": bool(state.locked),
              "authorized": bool(state.authorized),
              "status": state.status,
              "reason": state.reason,
              "source": state.source,
          }
          Path("logs/product/live_interlock_evidence.json").write_text(json.dumps(evidence, indent=2), encoding="utf-8")
          assert sha == os.environ["EXPECTED_SHA"]
          assert state.verified is True
          assert state.locked is True
          assert state.authorized is False
          PY

      - name: Validate Decision Simulation gate and create explicit replay evidence
        shell: bash
        run: |
          set -euo pipefail
          # Approval is impossible before the automatic startup discovery has
          # produced a fresh best-trades board. If discovery is still running,
          # prove the gate refuses approval, then wait for the autonomous scan
          # instead of manufacturing/rebuilding recommendations in this workflow.
          curl -fsS --max-time 20 http://127.0.0.1:8765/api/decision-simulation-gate > logs/product/simulator_gate.json
          ready="$(venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('logs/product/simulator_gate.json').read_text(encoding='utf-8'))
          if p.get('discovery_ready'):
              assert p.get('scan_fresh') is True, p
              assert str(p.get('phase') or '').upper() == 'AWAITING_APPROVAL', p
              print('1')
          else:
              assert p.get('approved') is False, p
              assert str(p.get('phase') or '').upper() == 'SEARCHING_BEST_TRADES', p
              print('0')
          PY
          )"

          if [[ "$ready" != 1 ]]; then
            curl -fsS --max-time 20 -X POST http://127.0.0.1:8765/api/decision-simulator > logs/product/simulator_approval.json
            venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('logs/product/simulator_approval.json').read_text(encoding='utf-8'))
          assert p.get('accepted') is False, p
          assert str(p.get('status') or '').upper() == 'WAITING_FOR_BEST_TRADES', p
          assert str((p.get('approval') or {}).get('reason') or '').upper() == 'BEST_TRADE_DISCOVERY_NOT_READY', p
          PY

            ready=0
            for _ in $(seq 1 480); do
              curl -fsS --max-time 20 http://127.0.0.1:8765/api/decision-simulation-gate > logs/product/simulator_gate.json
              if venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('logs/product/simulator_gate.json').read_text(encoding='utf-8'))
          raise SystemExit(0 if p.get('discovery_ready') else 1)
          PY
              then
                ready=1
                break
              fi
              if [[ -f logs/product/complete_stack.pid ]] && ! kill -0 "$(cat logs/product/complete_stack.pid)" 2>/dev/null; then
                echo "Complete stack exited while waiting for startup best-trade discovery" >&2
                tail -250 logs/product/complete_stack.log || true
                exit 1
              fi
              sleep 5
            done
            if [[ "$ready" != 1 ]]; then
              echo "Startup best-trade discovery did not become ready" >&2
              cat logs/product/simulator_gate.json || true
              tail -250 logs/product/complete_stack.log || true
              exit 1
            fi
          fi

          venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('logs/product/simulator_gate.json').read_text(encoding='utf-8'))
          assert p.get('discovery_ready') is True, p
          assert p.get('scan_fresh') is True, p
          assert str(p.get('phase') or '').upper() == 'AWAITING_APPROVAL', p
          assert p.get('approved') is False, p
          PY

          curl -fsS --max-time 20 -X POST http://127.0.0.1:8765/api/decision-simulator > logs/product/simulator_approval.json
          venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('logs/product/simulator_approval.json').read_text(encoding='utf-8'))
          assert p.get('accepted') is True, p
          assert str(p.get('status') or '').upper() == 'APPROVED', p
          assert p.get('simulation_authority') == 'quantterm-autonomy', p
          assert p.get('legacy_batch_started') is False, p
          assert set(p.get('simulation_scope') or []) == {'PAPER_FORWARD','HISTORICAL_REPLAY'}, p
          PY

          # Explicit historical inspection is intentionally independent of the
          # autonomous approval switch. Generate genuine PIT evidence directly;
          # this never opens PAPER_FORWARD positions or starts a duplicate loop.
          venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from product.decision_simulator import run_decision_simulator

          p = run_decision_simulator(force=True, async_job=False)
          Path('logs/product/simulator_replay.json').write_text(
              json.dumps(p, indent=2, default=str), encoding='utf-8'
          )
          assert str(p.get('status') or '').upper() == 'SUCCEEDED', p.get('status')
          rows=[r for r in (p.get('decisions') or p.get('rows') or []) if isinstance(r,dict)]
          rows=[r for r in rows if r.get('symbol') and (r.get('as_of') or r.get('market_as_of')) and str(r.get('decision') or '').upper() != 'NO_JUDGMENT']
          assert rows, 'historical replay SUCCEEDED but produced no real judgment usable by Simulate Past Decision'
          row=rows[0]
          seed={'symbol':str(row['symbol']).upper(),'as_of':str(row.get('as_of') or row.get('market_as_of'))[:10]}
          Path('logs/product/simulator_seed.json').write_text(json.dumps(seed,indent=2),encoding='utf-8')
          PY

      - name: Run exact-SHA product acceptance
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          SYMBOL="$(venv/bin/python -c "import json; print(json.load(open('logs/product/simulator_seed.json'))['symbol'])")"
          AS_OF="$(venv/bin/python -c "import json; print(json.load(open('logs/product/simulator_seed.json'))['as_of'])")"
          venv/bin/python scripts/run_product_acceptance.py \
            --symbol "$SYMBOL" --as-of "$AS_OF" --acquire \
            --operation-timeout 2400 --acquire-timeout 1200 --cycle-timeout 240 \
            --output logs/product/product_acceptance.json \
            2>&1 | tee logs/product/product_acceptance.log

      - name: Enforce strict product-acceptance contract
        shell: bash
        env:
          BROWSER_BURNIN_OUTCOME: ${{ steps.browser_burnin.outcome }}
        run: |
          set -euo pipefail
          test "$BROWSER_BURNIN_OUTCOME" = "success"
          venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('logs/product/product_acceptance.json')
          assert path.exists(), 'missing scripts/run_product_acceptance.py evidence'
          payload=json.loads(path.read_text(encoding='utf-8'))
          assert payload.get('code_sha') == os.environ['EXPECTED_SHA'], (payload.get('code_sha'), os.environ['EXPECTED_SHA'])
          assert payload.get('verdict') == 'PRODUCT ACCEPTANCE PASS', payload.get('verdict_reason')
          assert payload.get('live_lock_verified') is True
          assert payload.get('live_locked') is True
          assert payload.get('live_execution_authorized') is False
          rows={str(r.get('feature')):r for r in payload.get('features',[]) if isinstance(r,dict)}
          strict=[
              'Canonical stack / readiness','UI + report endpoints','Market Scan','Recommendations',
              'Market Report workspace','Stock Intelligence','Investigate / Due Diligence read',
              'Investigate acquire','Simulate Past Decision','Paper execution status',
              'Paper cycle request','Paper cycle execution','Learning loop dashboard','Forward soak verification',
          ]
          missing=[n for n in strict if n not in rows]
          bad={n:(rows[n].get('status'),rows[n].get('blocker_reason')) for n in strict if n in rows and rows[n].get('status')!='PASS'}
          assert not missing, f'missing required acceptance rows: {missing}'
          assert not bad, f'required acceptance rows not PASS: {bad}'
          data=rows.get('Data refresh')
          assert data, 'missing Data refresh evidence'
          assert str(data.get('freshness') or '').upper() == 'SUCCEEDED', data
          if data.get('status') != 'PASS':
              reason=str(data.get('blocker_reason') or '').upper()
              assert data.get('status') == 'DEGRADED', data
              assert 'FNO_UNIVERSE_UNAVAILABLE' in reason, data
              disallowed=[t for t in ('FAILED','EXCEPTION','SNAPSHOT_STALE','HISTORY_STALE','HISTORY_NOT_READY') if t in reason]
              assert not disallowed, f'Data refresh has non-F&O degradation: {disallowed}: {reason}'
          PY

      - name: Restart complete stack and prove durable recovery
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f logs/product/complete_stack.pid ]]; then
            launcher_pid="$(cat logs/product/complete_stack.pid)"
            # Reproduce terminal Ctrl-C: SIGINT goes to the launcher's process
            # group. The inner stack is intentionally in its own process group,
            # so the outer trap must shut it down deliberately and no worker may
            # survive by being reparented to PID 1.
            kill -INT "-$launcher_pid" 2>/dev/null || kill -INT "$launcher_pid" 2>/dev/null || true
            for _ in $(seq 1 40); do
              if ! kill -0 "$launcher_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$launcher_pid" 2>/dev/null; then
              echo "Complete launcher survived Ctrl-C shutdown budget" >&2
              exit 1
            fi
            # Give child traps a short final window, then prove the specific
            # production regression: no orphan market_ops and no desk/API ports.
            for _ in $(seq 1 20); do
              if ! pgrep -f '[o]perations[.]market_ops' >/dev/null 2>&1 \
                 && ! pgrep -f '[m]ain[.]py autonomy' >/dev/null 2>&1 \
                 && ! python scripts/local_stack.py ports-healthy --ports 5173,8765 >/dev/null 2>&1; then
                break
              fi
              sleep 0.25
            done
            python scripts/local_stack.py pids --ports 5173,8765,8766 > logs/product/post_sigint_pids.json || true
            if pgrep -af '[o]perations[.]market_ops' > logs/product/post_sigint_market_ops.txt 2>/dev/null; then
              echo "Orphan operations.market_ops survived Ctrl-C" >&2
              cat logs/product/post_sigint_market_ops.txt >&2
              exit 1
            fi
            if pgrep -af '[m]ain[.]py autonomy' > logs/product/post_sigint_autonomy.txt 2>/dev/null; then
              echo "Orphan autonomy supervisor survived Ctrl-C" >&2
              cat logs/product/post_sigint_autonomy.txt >&2
              exit 1
            fi
            venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('logs/product/post_sigint_pids.json').read_text(encoding='utf-8'))
          live_ports={p:payload.get(p) or [] for p in ('5173','8765','8766')}
          assert not any(live_ports.values()), f'listeners survived Ctrl-C: {live_ports}'
          PY
          fi
          nohup python scripts/session_exec.py bash scripts/run_quantterm_complete.sh --restart > logs/product/restart_stack.log 2>&1 &
          echo $! > logs/product/restart_stack.pid
          recovered=0
          for _ in $(seq 1 300); do
            api=0; ui=0; reports=0; health=0
            if curl -fsS --max-time 5 http://127.0.0.1:8765/api/health > logs/product/restart_health.json 2>/dev/null; then api=1; fi
            if curl -fsS --max-time 5 http://127.0.0.1:5173/ >/dev/null 2>&1; then ui=1; fi
            if curl -fsS --max-time 5 http://127.0.0.1:8766/health >/dev/null 2>&1; then reports=1; fi
            if [[ "$api" = 1 ]]; then
              if venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('logs/product/restart_health.json').read_text(encoding='utf-8'))
          raise SystemExit(0 if (
              p.get('ok') is True
              and p.get('operational_ready') is True
              and p.get('evidence_ready') is True
              and p.get('lifecycle')=='READY'
              and p.get('live_lock_verified') is True
              and p.get('live_locked') is True
              and p.get('live_execution_authorized') is False
          ) else 1)
          PY
              then health=1; fi
            fi
            if [[ "$api" = 1 && "$ui" = 1 && "$reports" = 1 && "$health" = 1 ]]; then recovered=1; break; fi
            if ! kill -0 "$(cat logs/product/restart_stack.pid)" 2>/dev/null; then
              echo 'Restarted stack exited before recovery' >&2
              tail -250 logs/product/restart_stack.log || true
              exit 1
            fi
            sleep 2
          done
          test "$recovered" = 1
          venv/bin/python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from product.live_execution_interlock import get_live_execution_state
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          health=json.loads(Path('logs/product/restart_health.json').read_text(encoding='utf-8'))
          acceptance=json.loads(Path('logs/product/product_acceptance.json').read_text(encoding='utf-8'))
          state=get_live_execution_state()
          assert sha == os.environ['EXPECTED_SHA']
          assert acceptance.get('code_sha') == sha
          assert acceptance.get('verdict') == 'PRODUCT ACCEPTANCE PASS'
          assert acceptance.get('live_lock_verified') is True
          assert acceptance.get('live_locked') is True
          assert acceptance.get('live_execution_authorized') is False
          assert state.verified is True and state.locked is True and state.authorized is False
          evidence={
              'code_sha':sha,'expected_sha':os.environ['EXPECTED_SHA'],'recovered':True,
              'health':{k:health.get(k) for k in ('ok','lifecycle','operational_ready','evidence_ready','live_lock_verified','live_locked','live_execution_authorized')},
              'live_interlock':{'verified':state.verified,'locked':state.locked,'authorized':state.authorized,'status':state.status,'source':state.source},
              'product_acceptance_verdict':acceptance.get('verdict'),'product_acceptance_code_sha':acceptance.get('code_sha'),
          }
          Path('logs/product/restart_recovery_evidence.json').write_text(json.dumps(evidence,indent=2),encoding='utf-8')
          PY

      - name: Upload exact-SHA acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            logs/product/product_acceptance.json
            logs/product/product_acceptance.log
            logs/product/live_interlock_evidence.json
            logs/product/pre_acceptance_health.json
            logs/product/pre_acceptance_report_health.json
            logs/product/operator_status.json
            logs/product/simulator_gate.json
            logs/product/simulator_approval.json
            logs/product/simulator_replay.json
            logs/product/simulator_seed.json
            logs/product/restart_health.json
            logs/product/restart_recovery_evidence.json
            logs/product/post_sigint_pids.json
            logs/product/post_sigint_market_ops.txt
            logs/product/post_sigint_autonomy.txt
            logs/product/complete_stack.log
            logs/product/restart_stack.log
            frontend/test-results/
            logs/product/frontend_burnin.json


  macos-runtime-smoke:
    name: macos-intel-runtime-smoke
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      QT_NONINTERACTIVE: "1"
      QT_NO_BROWSER: "1"
      KITE_ACCESS_TOKEN: ""
      KITE_API_KEY: ""
      KITE_API_SECRET: ""
      TELEGRAM_BOT_TOKEN: ""
      DEEPSEEK_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""

    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"

      - name: Start real one-command QuantTerm stack on Intel macOS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/product
          nohup python scripts/session_exec.py bash scripts/run_quantterm_complete.sh --restart             > logs/product/mac_complete_stack.log 2>&1 &
          echo $! > logs/product/mac_complete_stack.pid

      - name: Prove live endpoints and operator status stay healthy under bootstrap load
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for _ in $(seq 1 600); do
            if curl -fsS --max-time 5 http://127.0.0.1:8765/api/health > logs/product/mac_health.json 2>/dev/null               && curl -fsS --max-time 5 http://127.0.0.1:5173/ >/dev/null 2>&1               && curl -fsS --max-time 5 http://127.0.0.1:8766/health > logs/product/mac_report_health.json 2>/dev/null               && [[ -x venv/bin/python ]]               && venv/bin/python scripts/quantterm_status.py > logs/product/mac_operator_status.json 2>/dev/null; then
              ready=1
              break
            fi
            if [[ -f logs/product/mac_complete_stack.pid ]] && ! kill -0 "$(cat logs/product/mac_complete_stack.pid)" 2>/dev/null; then
              echo "macOS launcher exited before runtime became healthy" >&2
              tail -250 logs/product/mac_complete_stack.log || true
              exit 1
            fi
            sleep 2
          done
          test "$ready" = 1

          venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('logs/product/mac_health.json').read_text())
          s=json.loads(Path('logs/product/mac_operator_status.json').read_text())
          assert h.get('ok') is True, h
          assert h.get('operational_ready') is True, h
          assert h.get('live_lock_verified') is True, h
          assert h.get('live_locked') is True, h
          assert h.get('live_execution_authorized') is False, h
          assert s.get('ready') is True, s
          assert (s.get('market_api') or {}).get('healthy') is True, s
          assert (s.get('desk') or {}).get('healthy') is True, s
          assert (s.get('market_ops') or {}).get('healthy') is True, s
          PY

          # Stay alive through active background work rather than accepting one lucky probe.
          for sample in $(seq 1 6); do
            sleep 10
            venv/bin/python scripts/quantterm_status.py > "logs/product/mac_operator_status_${sample}.json"
          done

      - name: Inspect real Decision Simulation and Forward Evidence surfaces
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 http://127.0.0.1:8765/api/decision-simulation-gate             > logs/product/mac_decision_gate.json
          curl -fsS --max-time 10 http://127.0.0.1:8765/api/forward-evidence             > logs/product/mac_forward_evidence.json
          venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          gate=json.loads(Path('logs/product/mac_decision_gate.json').read_text())
          forward=json.loads(Path('logs/product/mac_forward_evidence.json').read_text())
          phase=str(gate.get('phase') or '')
          assert phase in {'SEARCHING_BEST_TRADES','AWAITING_APPROVAL','APPROVED'}, gate
          assert gate.get('approved') in {True, False}, gate
          assert isinstance(forward, dict) and forward, forward
          PY

      - name: Reproduce Ctrl-C shutdown and prove no orphan desk survives
        shell: bash
        run: |
          set -euo pipefail
          pid="$(cat logs/product/mac_complete_stack.pid)"
          kill -INT "-$pid" 2>/dev/null || kill -INT "$pid" 2>/dev/null || true
          for _ in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "macOS complete launcher survived Ctrl-C shutdown budget" >&2
            exit 1
          fi
          for _ in $(seq 1 40); do
            if ! python scripts/local_stack.py ports-healthy --ports 5173,8765,8766 >/dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done
          python scripts/local_stack.py pids --ports 5173,8765,8766 > logs/product/mac_post_sigint_pids.json || true
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('logs/product/mac_post_sigint_pids.json').read_text())
          live={port:p.get(port) or [] for port in ('5173','8765','8766')}
          assert not any(live.values()), live
          PY

      - name: Upload macOS runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            logs/product/mac_complete_stack.log
            logs/product/mac_health.json
            logs/product/mac_report_health.json
            logs/product/mac_operator_status*.json
            logs/product/mac_decision_gate.json
            logs/product/mac_forward_evidence.json
            logs/product/mac_post_sigint_pids.json
