name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "actual=$actual"
          echo "expected=$expected"
          test "$actual" = "$expected"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Canonical gate — hermetic, zero external network
        # NETWORK = FORBIDDEN. tests/conftest.py installs a socket-level policy:
        # anything off this machine is refused AND recorded, and the attempt
        # alone fails the test, so a module that swallows the error cannot hide.
        # tests/integration and any live_source test are excluded BY
        # CLASSIFICATION, not by an ad-hoc --ignore.
        run: |
          python -m pytest
        env:
          # Tests must never touch real accounts even if secrets leak into env
          KITE_ACCESS_TOKEN: ""
          TELEGRAM_BOT_TOKEN: ""
          DEEPSEEK_API_KEY: ""

      - name: Validate launch and supervisor scripts
        run: |
          bash -n scripts/run_quantterm_complete.sh
          bash -n scripts/run_quantterm.sh
          python -m py_compile scripts/local_stack.py

      - name: Compile every module (import-safety net)
        # Compile before environment-dependent smoke so a slow provider test can
        # never prevent the deterministic import-safety gate from running.
        run: |
          python -m compileall -q data scan risk execution ui reports ai core alerts news research product reporting operations fundamentals
          python -m py_compile terminal_api.py terminal_product_api.py report_api.py

      - name: Integration gate — controlled external dependencies
        # Explicitly NOT the canonical gate: heavy import chains and real
        # sources. Bounded and non-blocking so an upstream outage cannot fail
        # a deterministic build.
        continue-on-error: true
        run: |
          timeout 120s env QT_INTEGRATION=1 python -m pytest tests/integration -q --tb=short
        env:
          KITE_ACCESS_TOKEN: ""
          TELEGRAM_BOT_TOKEN: ""
          DEEPSEEK_API_KEY: ""

      - name: Live-source gate — real upstreams (never blocks the build)
        # The only place a test is allowed off the machine. Deselected from the
        # canonical run by classification; surfaced here so an upstream that has
        # changed shape is visible rather than silently untested.
        continue-on-error: true
        run: |
          timeout 300s env QT_LIVE_SOURCE=1 python -m pytest -m live_source -q --tb=short
        env:
          KITE_ACCESS_TOKEN: ""
          TELEGRAM_BOT_TOKEN: ""
          DEEPSEEK_API_KEY: ""
