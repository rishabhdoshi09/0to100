name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "actual=$actual"
          echo "expected=$expected"
          test "$actual" = "$expected"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Canonical gate — hermetic, zero external network
        # NETWORK = FORBIDDEN. tests/conftest.py installs a socket-level policy:
        # anything off this machine is refused AND recorded, and the attempt
        # alone fails the test, so a module that swallows the error cannot hide.
        # tests/integration and any live_source test are excluded BY
        # CLASSIFICATION, not by an ad-hoc --ignore.
        run: |
          python -m pytest
        env:
          KITE_ACCESS_TOKEN: ""
          TELEGRAM_BOT_TOKEN: ""
          DEEPSEEK_API_KEY: ""

      - name: Validate launch and supervisor scripts
        run: |
          bash -n scripts/run_quantterm_complete.sh
          bash -n scripts/run_quantterm.sh
          bash -n scripts/run_quantterm_mac.sh
          bash -n scripts/quantterm_storage_preflight.sh
          bash -n scripts/install_quantterm_host.sh
          bash -n scripts/quantterm_status.sh
          bash -n scripts/quantterm_restart.sh
          bash -n deploy/setup_mac.sh
          bash -n deploy/setup_server.sh
          python -m py_compile scripts/local_stack.py

      - name: Compile every module (import-safety net)
        # Compile before environment-dependent smoke so a slow provider test can
        # never prevent the deterministic import-safety gate from running.
        run: |
          python -m compileall -q data scan risk execution ui reports ai core alerts news research product reporting operations fundamentals expectancy
          python -m py_compile terminal_api.py terminal_product_api.py terminal_product_api_parallel.py report_api.py
          python -m py_compile scripts/run_product_acceptance.py scripts/_product_acceptance_core.py
          python -m py_compile product/paper_learning_loop.py product/_paper_learning_loop_core.py
          python -m py_compile _terminal_product_api_parallel_core.py

      - name: Integration gate — controlled external dependencies
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout 120s env QT_INTEGRATION=1 python -m pytest tests/integration -q --tb=short 2>&1 | tee /tmp/quantterm-integration.log
        env:
          KITE_ACCESS_TOKEN: ""
          TELEGRAM_BOT_TOKEN: ""
          DEEPSEEK_API_KEY: ""

      - name: Enforce no durable-state contamination
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/quantterm-integration.log ] && grep -q "TEST CONTAMINATION:" /tmp/quantterm-integration.log; then
            echo "::error::Integration execution changed protected checkout/runtime state."
            cat /tmp/quantterm-integration.log
            exit 1
          fi

      - name: Live-source gate — real upstreams (never blocks the build)
        continue-on-error: true
        run: |
          timeout 300s env QT_LIVE_SOURCE=1 python -m pytest -m live_source -q --tb=short
        env:
          KITE_ACCESS_TOKEN: ""
          TELEGRAM_BOT_TOKEN: ""
          DEEPSEEK_API_KEY: ""
