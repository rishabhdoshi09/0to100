[pytest]
testpaths = tests
addopts = -q --tb=short
markers =
    integration: environment-dependent / slow tests (heavy import chains, may need
        network). Excluded from the default network-free suite via tests/conftest.py;
        run with QT_INTEGRATION=1 python -m pytest tests/integration
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
