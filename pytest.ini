[pytest]
testpaths = tests
addopts = -q --tb=short
markers =
    integration: environment-dependent / slow tests (heavy import chains, may need
        network). Excluded from the default network-free suite via tests/conftest.py;
        run with QT_INTEGRATION=1 python -m pytest tests/integration
    network: this test is allowed to open a socket off the machine. The canonical
        suite forbids it by default; every attempt is recorded and fails the test.
    live_source: validates a real upstream source (NSE, the broker, a news feed).
        Never part of the canonical gate — run it explicitly with -m live_source.
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
